name: MADAR checks
on: [push, pull_request]
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18
        env: {POSTGRES_DB: madar_test, POSTGRES_USER: madar, POSTGRES_PASSWORD: test_only_password}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U madar -d madar_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test
        env: {DATABASE_URL: 'postgresql://madar:test_only_password@127.0.0.1:5432/madar_test'}
      - run: npm run test:redis
        env: {TEST_REDIS_URL: 'redis://127.0.0.1:6379/15', TEST_DATABASE_URL: 'postgresql://madar:test_only_password@127.0.0.1:5432/madar_test'}
      - run: npm run test:admin
      - run: npm run typecheck
      - run: npm run build
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.9', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=MADAR_DEMO=true
      - uses: actions/upload-artifact@v4
        with:
          name: madar-tv-debug
          path: apps/tv/build/app/outputs/flutter-apk/app-debug.apk
